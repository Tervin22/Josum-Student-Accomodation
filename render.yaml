# Temporary client testing: all resources must stay on the free plan.
# The paid production template is preserved as render.production.yaml.
databases:
  - name: josum-client-test-db-20261028
    databaseName: residence_preview
    user: preview_app
    plan: free
    postgresMajorVersion: "18"
    region: frankfurt
    ipAllowList: []

services:
  - type: web
    name: josum-client-test-api-20261028-tervin22
    branch: codex/client-preview-20261028
    runtime: node
    plan: free
    region: frankfurt
    buildCommand: corepack pnpm install --frozen-lockfile --prod=false && corepack pnpm --filter @josum/api prisma:generate && corepack pnpm --filter @josum/api build
    startCommand: corepack pnpm --filter @josum/api prisma:migrate:deploy && corepack pnpm --filter @josum/api prisma:seed && corepack pnpm --filter @josum/api start
    healthCheckPath: /health/ready
    autoDeployTrigger: "off"
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: NODE_ENV
        value: production
      - key: API_PORT
        value: "10000"
      - key: TS_NODE_TRANSPILE_ONLY
        value: "true"
      - key: CLIENT_PREVIEW_MODE
        value: "true"
      - key: APP_NAME
        value: Student Residence Portal Client Testing
      - key: DATABASE_URL
        fromDatabase:
          name: josum-client-test-db-20261028
          property: connectionString
      - key: PUBLIC_APP_URL
        value: https://josum-client-test-20261028-tervin22.onrender.com
      - key: WEB_ORIGIN
        value: https://josum-client-test-20261028-tervin22.onrender.com
      - key: ENABLE_ADMIN_BOOTSTRAP
        value: "false"
      - key: ENABLE_SWAGGER
        value: "false"
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: INSTALLATION_ADMIN_TOKEN
        generateValue: true
      - key: FACTORY_RESET_RECOVERY_KEY
        generateValue: true
      - key: STAFF_MANAGER_REGISTRATION_KEY
        generateValue: true
      - key: STAFF_SECURITY_REGISTRATION_KEY
        generateValue: true
      - key: STAFF_TECHNICIAN_REGISTRATION_KEY
        generateValue: true
      - key: SMTP_HOST
        value: 127.0.0.1
      - key: SMTP_PORT
        value: "2525"
      - key: SMTP_SECURE
        value: "false"
      - key: SMTP_FROM
        value: preview@example.invalid
      - key: STORAGE_DRIVER
        value: local
      - key: LOCAL_STORAGE_PATH
        value: /tmp/residence-preview-uploads

  - type: web
    name: josum-client-test-20261028-tervin22
    branch: codex/client-preview-20261028
    runtime: node
    plan: free
    region: frankfurt
    buildCommand: corepack pnpm install --frozen-lockfile --prod=false && corepack pnpm --filter @josum/web build
    startCommand: corepack pnpm --filter @josum/web exec next start --hostname 0.0.0.0 --port $PORT
    healthCheckPath: /health
    autoDeployTrigger: "off"
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: NODE_ENV
        value: production
      - key: NEXT_PUBLIC_CLIENT_PREVIEW_MODE
        value: "true"
      - key: NEXT_PUBLIC_API_URL
        fromService:
          name: josum-client-test-api-20261028-tervin22
          type: web
          envVarKey: RENDER_EXTERNAL_URL
      - key: NEXT_PUBLIC_BRAND_LOGO_URL
        value: /logo.svg
      - key: NEXT_PUBLIC_AUTH_HERO_IMAGE_URL
        value: https://romares.co.za/wp-content/uploads/2026/09/exterior-1.jpg
