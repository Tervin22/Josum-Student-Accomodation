databases:
  - name: eduloft-db
    databaseName: eduloft_accommodation
    user: eduloft
    plan: starter

services:
  - type: web
    name: eduloft-api
    runtime: docker
    dockerfilePath: apps/api/Dockerfile
    plan: starter
    healthCheckPath: /health/ready
    envVars:
      - key: NODE_ENV
        value: production
      - key: APP_NAME
        value: Eduloft
      - key: BRAND_LOGO_URL
        value: https://eduloft.co.za/wp-content/uploads/2025/07/EDULOFT-LOGO-FINAL-1024x241.png
      - key: DATABASE_URL
        fromDatabase:
          name: eduloft-db
          property: connectionString
      - key: API_PORT
        value: 4000
      - key: PUBLIC_APP_URL
        sync: false
      - key: WEB_ORIGIN
        sync: false
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: INSTALLATION_ADMIN_TOKEN
        generateValue: true
      - key: FACTORY_RESET_RECOVERY_KEY
        generateValue: true
      - key: STAFF_MANAGER_REGISTRATION_KEY
        generateValue: true
      - key: STAFF_SECURITY_REGISTRATION_KEY
        generateValue: true
      - key: STAFF_TECHNICIAN_REGISTRATION_KEY
        generateValue: true
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        sync: false
      - key: SMTP_SECURE
        value: false
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: SMTP_FROM
        value: Eduloft <no-reply@eduloft.example>
      - key: STORAGE_DRIVER
        value: local
      - key: LOCAL_STORAGE_PATH
        value: /app/uploads

  - type: web
    name: eduloft-web
    runtime: docker
    dockerfilePath: apps/web/Dockerfile
    plan: starter
    healthCheckPath: /login
    envVars:
      - key: NODE_ENV
        value: production
      - key: NEXT_STANDALONE
        value: true
      - key: NEXT_PUBLIC_API_URL
        sync: false
      - key: NEXT_PUBLIC_BRAND_LOGO_URL
        value: /eduloft/eduloft-logo.png
      - key: NEXT_PUBLIC_AUTH_HERO_IMAGE_URL
        value: /eduloft/eduloft-featured.webp
