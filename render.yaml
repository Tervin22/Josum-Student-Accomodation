databases:
  - name: nathi-db
    plan: free
    databaseName: louiseville_accommodation
    user: louiseville

services:
  - type: web
    name: nathi-api
    runtime: docker
    dockerfilePath: ./apps/api/Dockerfile
    dockerContext: .
    plan: free
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: APP_NAME
        value: "Josum Student Accommodation"
      - key: BRAND_LOGO_URL
        value: https://josumres.co.za/wp-content/uploads/2025/08/Josum-Company-Logo-Final-Homepage.png
      - key: DATABASE_URL
        fromDatabase:
          name: nathi-db
          property: connectionString
      - key: API_PORT
        value: 4000
      - key: WEB_ORIGIN
        sync: false
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: JWT_ACCESS_EXPIRES_IN
        value: 15m
      - key: JWT_REFRESH_EXPIRES_IN
        value: 7d
      - key: INSTALLATION_ADMIN_TOKEN
        generateValue: true
      - key: FACTORY_RESET_RECOVERY_KEY
        generateValue: true
      - key: STAFF_MANAGER_REGISTRATION_KEY
        generateValue: true
      - key: STAFF_SECURITY_REGISTRATION_KEY
        generateValue: true
      - key: STAFF_TECHNICIAN_REGISTRATION_KEY
        generateValue: true
      - key: BCRYPT_ROUNDS
        value: 12
      - key: THROTTLE_TTL_MS
        value: 60000
      - key: THROTTLE_LIMIT
        value: 120
      - key: APPLICATION_APPROVAL_EXPIRY_HOURS
        value: 72
      - key: MAINTENANCE_ACK_SLA_HOURS
        value: 24
      - key: MAINTENANCE_LOW_RESOLUTION_SLA_HOURS
        value: 48
      - key: MAINTENANCE_HIGH_RESOLUTION_SLA_HOURS
        value: 12
      - key: MAINTENANCE_SLA_SWEEP_INTERVAL_MS
        value: 300000
      - key: PAYMENT_REMINDER_SWEEP_INTERVAL_MS
        value: 3600000
      - key: PAYMENT_REMINDER_BATCH_SIZE
        value: 500
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        value: 587
      - key: SMTP_SECURE
        value: true
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: SMTP_FROM
        value: "Josum Student Accommodation <no-reply@josum.example>"
      - key: STORAGE_DRIVER
        value: local
      - key: LOCAL_STORAGE_PATH
        value: /app/uploads
      - key: MAX_UPLOAD_BYTES
        value: 10485760
      - key: STORAGE_MAX_ITEM_IMAGES
        value: 6
      - key: ALLOWED_UPLOAD_MIME_TYPES
        value: application/pdf,image/jpeg,image/png

  - type: web
    name: nathi-web
    runtime: docker
    dockerfilePath: ./apps/web/Dockerfile
    dockerContext: .
    plan: free
    envVars:
      - key: NODE_ENV
        value: production
      - key: NEXT_PUBLIC_BRAND_LOGO_URL
        value: https://josumres.co.za/wp-content/uploads/2025/08/Josum-Company-Logo-Final-Homepage.png
      - key: NEXT_PUBLIC_AUTH_HERO_IMAGE_URL
        value: https://josumres.co.za/wp-content/uploads/2025/08/WhatsApp-Image-2025-07-24-at-15.32.24_7cd2a337.jpg
      - key: NEXT_PUBLIC_API_URL
        fromService:
          name: nathi-api
          type: web
          envVarKey: RENDER_EXTERNAL_URL